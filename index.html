    <title>ICON-D2 RUC | Hourly Forecast</title>
    <script>
      window.WEATHER_DEBUG = new URLSearchParams(window.location.search).get('debug') === 'true';

      if (window.WEATHER_DEBUG) {
          // 1. Eruda Skript-Tag erstellen
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/eruda';
          
          // 2. Initialisieren, sobald das Skript geladen ist
          script.onload = function () {
              eruda.init({
                  theme: 'dark',
                  defaults: {
                      displaySize: 50, 
                      transparency: 90
                  }
              });
              console.log('Eruda DevTools erfolgreich geladen. Viel Spaß beim Debuggen!');
              
              // Falls du den Puffer-Logger nutzt, hier einspielen:
              // if (window.flushEarlyLogs) window.flushEarlyLogs();
          };   

          // 3. WICHTIG: In den <head> (document.head) einfügen, da body noch null ist!
          document.head.appendChild(script);
      }
    </script>
