name: Deploy typescript Branch to Cloudflare Pages

on:
  push:
    branches:
      - typescript # Triggert die Action nur bei Änderungen auf dem Branch "mvc"
  workflow_dispatch: # Ermöglicht den manuellen Start über die GitHub-Website

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Code aus dem Repository auschecken
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Lint, typecheck and build
      - name: Run lint (CI)
        run: npm run lint:ci

      - name: Run typecheck (skip lint)
        run: npm run typecheck

      - name: Build project
        run: npm run build

      # 2. Direkt zu Cloudflare Pages hochladen
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          accountId: c728452fcd5090f3d7f2bacc5e75fcd2
          projectName: 'windapp-preview' # Der Name deines Cloudflare-Projekts
          directory: './dist'         # '.' bedeutet, dass das gesamte Hauptverzeichnis hochgeladen wird
