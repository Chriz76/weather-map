name: Deploy Application

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Node.js & Python einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bunny CLI installieren
        run: |
          curl -sSL https://bunny.net/install-cli.sh | bash

      - name: Dummy-Dateien erzeugen und zu Bunny Edge Storage hochladen
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
        run: |
          mkdir -p /tmp/bench && cd /tmp/bench
          
          # 15.000 Testdateien à ~20 KB erzeugen
          python3 -c "
          import os
          os.makedirs('t', exist_ok=True)
          for i in range(15000):
              open(f't/{i}.pbf', 'wb').write(os.urandom(20000))
          "
          
          # Uploadzeit mit bunny-cli messen
          time bunny storage upload ./t / \
            --storage-zone "$BUNNY_STORAGE_ZONE" \
            --access-key "$BUNNY_STORAGE_PASSWORD"
