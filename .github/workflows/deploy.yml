name: Deploy Application

on:
  push:
    branches:
      - typescript
      - develop
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    # Wichtig: Das Environment wird dynamisch gesetzt, damit GitHub Pages nicht bei develop fehlschlägt
    environment:
      name: ${{ github.ref_name == 'typescript' && 'github-pages' || 'cloudflare-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint (CI)
        run: npm run lint:ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Build project
        run: npm run build

      # ==========================================
      # DEPLOYMENT: GitHub Pages (Nur auf 'typescript')
      # ==========================================
      - name: Upload artifact for GitHub Pages
        if: github.ref_name == 'typescript'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        if: github.ref_name == 'typescript'
        id: deployment
        uses: actions/deploy-pages@v4

      # ==========================================
      # DEPLOYMENT: Cloudflare Pages (Nur auf 'develop')
      # ==========================================
      - name: Deploy to Cloudflare Pages
        if: github.ref_name == 'develop'
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.NETLIFY_AUTH_TOKEN }} # Hinweisschild weiter unten beachten
          accountId: c728452fcd5090f3d7f2bacc5e75fcd2
          projectName: 'windapp-preview'
          directory: './dist'
