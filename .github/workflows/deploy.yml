name: Deploy Application

on:
  push:
    # Reagiert auf alle Branches
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: ${{ github.ref_name == 'typescript' && 'github-pages' || 'cloudflare-pages' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Node.js & Python einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Dummy-Dateien erzeugen und wrangler deploy ausführen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          mkdir -p /tmp/bench && cd /tmp/bench
          python3 -c "
          import os
          os.makedirs('t', exist_ok=True)
          for i in range(15000):
              open(f't/{i}.pbf', 'wb').write(os.urandom(20000))
          "
          time npx wrangler pages deploy t --project-name winddata          
