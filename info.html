<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><%= pageTitle %></title>
  <meta name="description" content="<%= description %>">
  <link rel="canonical" href="https://wind.zink.tv/info.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="<%= pageTitle %>">
  <meta property="og:description" content="<%= description %>">
  <meta property="og:url" content="https://wind.zink.tv/info.html">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
  <style>
    :root {
      color-scheme: light;
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #dbe3ee;
      --accent: #0ea5e9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eff6ff 0%, var(--bg) 180px);
      color: var(--text);
      line-height: 1.6;
    }

    main {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.06);
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.1;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 72ch;
    }

    .hero a {
      color: var(--accent);
    }

    .content {
      margin-top: 28px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: clamp(20px, 3vw, 36px);
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.04);
    }

    .content h2,
    .content h3,
    .content h4 {
      line-height: 1.2;
      margin-top: 2rem;
    }

    .content h2:first-child,
    .content h3:first-child,
    .content h4:first-child {
      margin-top: 0;
    }

    .content img {
      max-width: 100%;
      height: auto;
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
      display: block;
      overflow-x: auto;
      margin: 1.5rem 0;
    }

    .content th,
    .content td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      vertical-align: top;
    }

    .content blockquote {
      margin: 1.5rem 0;
      padding: 0.75rem 1rem;
      border-left: 4px solid var(--accent);
      background: #f0f9ff;
    }

    .content hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    .content a {
      color: #0369a1;
    }

    .content code {
      background: #eef2ff;
      padding: 0.15rem 0.35rem;
      border-radius: 6px;
    }

    .content pre {
      overflow-x: auto;
      padding: 1rem;
      border-radius: 14px;
      background: #0f172a;
      color: #e2e8f0;
    }

    @media (max-width: 640px) {
      main {
        padding-inline: 12px;
      }

      .hero,
      .content {
        border-radius: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <article class="content">
      <%- infoContent %>
    </article>
  </main>
</body>
</html>
